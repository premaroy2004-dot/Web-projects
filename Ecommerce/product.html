<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | EliteCommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Elite<span>Commerce</span></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <i class="fas fa-search" id="search-icon"></i>
                    <a href="wishlist.html" class="wishlist-count">
                        <i class="far fa-heart"></i>
                        <span class="badge" id="wishlist-badge">0</span>
                    </a>
                    <a href="cart.html" class="cart-count">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cart-badge">0</span>
                    </a>
                    <i class="fas fa-bars menu-toggle" id="menu-toggle"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="product-details" id="product-details-container">
            <!-- Product details will be injected by JS -->
        </section>

        <!-- Related Products -->
        <section class="related-products">
            <div class="section-title">
                <h2>Related Products</h2>
            </div>
            <div class="product-grid" id="related-products-grid">
                <!-- Related products will be injected by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <a href="index.html" class="logo" style="color: white;">Elite<span>Commerce</span></a>
                    <p style="margin-top: 20px; color: #ccc;">Your one-stop destination for premium lifestyle products.</p>
                </div>
                <div class="footer-col">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h3>Newsletter</h3>
                    <form id="newsletter-form" style="display: flex; gap: 10px;">
                        <input type="email" placeholder="Your Email" style="padding: 10px; border-radius: 5px; border: none; flex: 1;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 20px;">Join</button>
                    </form>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 EliteCommerce. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/product.js"></script>
</body>
</html>
