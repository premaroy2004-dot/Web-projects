<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | EliteCommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Elite<span>Commerce</span></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <a href="wishlist.html" class="wishlist-count">
                        <i class="far fa-heart"></i>
                        <span class="badge" id="wishlist-badge">0</span>
                    </a>
                    <a href="cart.html" class="cart-count">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="badge" id="cart-badge">0</span>
                    </a>
                    <i class="fas fa-bars menu-toggle" id="menu-toggle"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 80px 0;">
        <div class="section-title">
            <h2>Get In Touch</h2>
            <p>We'd love to hear from you</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px;">
            <!-- Contact Info -->
            <div class="contact-info">
                <div style="margin-bottom: 40px;">
                    <h3 style="margin-bottom: 20px;">Contact Information</h3>
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <i class="fas fa-map-marker-alt" style="color: var(--primary-color);"></i>
                        <div>
                            <h4>Address</h4>
                            <p style="color: var(--secondary-color);">123 Commerce St, New York, NY 10001</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <i class="fas fa-phone" style="color: var(--primary-color);"></i>
                        <div>
                            <h4>Phone</h4>
                            <p style="color: var(--secondary-color);">+1 (234) 567-890</p>
                        </div>
                    </div>
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <i class="fas fa-envelope" style="color: var(--primary-color);"></i>
                        <div>
                            <h4>Email</h4>
                            <p style="color: var(--secondary-color);">support@elitecommerce.com</p>
                        </div>
                    </div>
                </div>
                
                <div class="map-placeholder" style="width: 100%; height: 250px; background: #eee; border-radius: var(--border-radius); display: flex; align-items: center; justify-content: center; color: #888;">
                    <p><i class="fas fa-map"></i> Google Maps Placeholder</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form">
                <form id="contact-form" style="display: grid; gap: 20px;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <input type="text" placeholder="Your Name" style="padding: 15px; border: 1px solid var(--gray-light); border-radius: 5px; outline: none;" required>
                        <input type="email" placeholder="Your Email" style="padding: 15px; border: 1px solid var(--gray-light); border-radius: 5px; outline: none;" required>
                    </div>
                    <input type="text" placeholder="Subject" style="padding: 15px; border: 1px solid var(--gray-light); border-radius: 5px; outline: none;" required>
                    <textarea placeholder="Your Message" rows="6" style="padding: 15px; border: 1px solid var(--gray-light); border-radius: 5px; outline: none; resize: none;" required></textarea>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 EliteCommerce. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you for your message! We will get back to you soon.');
            e.target.reset();
        });
    </script>
</body>
</html>
